<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigo Live Stream</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            margin: 0 0 16px 0;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding: 12px 20px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            font-size: 0.875rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 9999px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .badge-live {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .badge-offline {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .stats {
            display: flex;
            gap: 16px;
            color: #94a3b8;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Vigo Live</h1>

        <div id="video-container">
            <div id="loading" class="loading-overlay">
                <div class="spinner"></div>
                <p style="margin-top: 12px;">Connecting to Stream...</p>
            </div>
            <canvas id="video-canvas"></canvas>
        </div>

        <div class="status-bar">
            <div id="status-badge" class="badge badge-offline">
                <div class="pulse"></div>
                <span id="status-text">Disconnected</span>
            </div>
            <div class="stats">
                <span>FPS: <span id="fps-val">0</span></span>
                <span>Latency: <span id="latency-val">--</span>ms</span>
            </div>
        </div>
    </div>

    <!-- Broadway H.264 Decoder -->
    <script src="libs/Decoder.js"></script>
    <script src="libs/YUVCanvas.js"></script>
    <script src="libs/Player.js"></script>

    <script>
        const canvas = document.getElementById('video-canvas');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const loading = document.getElementById('loading');
        const fpsVal = document.getElementById('fps-val');

        let frameCount = 0;
        let lastTime = performance.now();

        // For offline/single-file support, we can use a Blob URL for the worker
        // if the Decoder.js content is available globally (which it is when inlined)
        let workerUrl = 'libs/Decoder.js';
        if (typeof Decoder !== 'undefined' && Decoder.toString().length > 100) {
            // This is a fallback check if we decided to inline everything
            // For now we use the path, but the build tool will handle inlining
        }

        // Initialize Broadway Player
        const player = new Player({
            useWorker: true,
            workerFile: workerUrl,
            size: { width: 1280, height: 960 }
        });

        const videoContainer = document.getElementById('video-container');
        videoContainer.appendChild(player.canvas);
        canvas.style.display = 'none'; // Use Player's canvas instead

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}/stream`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                statusBadge.className = 'badge badge-live';
                statusText.textContent = 'Live';
                loading.style.display = 'none';
                console.log('Connected to stream');
            };

            ws.onmessage = (evt) => {
                const data = new Uint8Array(evt.data);
                player.decode(data);

                frameCount++;
                const now = performance.now();
                if (now - lastTime >= 1000) {
                    fpsVal.textContent = Math.round((frameCount * 1000) / (now - lastTime));
                    frameCount = 0;
                    lastTime = now;
                }
            };

            ws.onclose = () => {
                statusBadge.className = 'badge badge-offline';
                statusText.textContent = 'Disconnected';
                loading.style.display = 'flex';
                setTimeout(connect, 2000);
            };

            ws.onerror = (err) => {
                console.error('WebSocket Error:', err);
            };
        }

        connect();
    </script>
</body>

</html>
